## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url = jdbc:mysql://localhost:3306/welfare?useSSL=false&useLegacyDatetimeCode=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username = root
spring.datasource.password =


## Hibernate Properties
# Dialeto SQL para melhorar o SQL gerado pelo Hibernate
# spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect

# Criar tabela automaticamente (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update

# apresenta os statements(SQL) no console
spring.jpa.properties.hibernate.show_sql=true

#spring-boot-starter-mail properties
spring.mail.host=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.port=465
spring.mail.properties.mail.smtp.starttls.port=587
spring.mail.username=
spring.mail.password=

spring.mail.test-connection=false
